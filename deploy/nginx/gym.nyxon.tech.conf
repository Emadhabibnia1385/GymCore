# GymCore web panel — affects ONLY the host name gym.nyxon.tech; no other server block is edited.
# Installed by hand (this server is shared): copy to /etc/nginx/sites-available/, link into
# sites-enabled/, `nginx -t`, reload. The certificate comes from certbot (webroot).
server {
    listen 80;
    listen [::]:80;
    server_name gym.nyxon.tech;
    location /.well-known/acme-challenge/ { root /var/www/gymcore-acme; }
    location / { return 301 https://$host$request_uri; }
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name gym.nyxon.tech;

    ssl_certificate     /etc/letsencrypt/live/gym.nyxon.tech/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/gym.nyxon.tech/privkey.pem;
    add_header Strict-Transport-Security "max-age=31536000" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "same-origin" always;

    root /opt/gymcore/web/dist;
    index index.html;

    # Program files up to the app's own limit (MAX_UPLOAD_MB, 20) plus form overhead.
    client_max_body_size 22m;

    # Only /api reaches the app. Its health, webhook and docs routes are never public.
    # The real client address is passed so sign-in and sign-up throttling is per visitor.
    location /api/ {
        proxy_pass http://127.0.0.1:8815;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto https;
        proxy_read_timeout 60s;
        add_header Cache-Control "no-store" always;   # a person's data is never cached
    }

    # The app shell and its worker must always be revalidated; hashed assets never change.
    location = /index.html { add_header Cache-Control "no-cache"; }
    location = /sw.js { add_header Cache-Control "no-cache"; }
    location = /manifest.webmanifest { add_header Cache-Control "no-cache"; types { } default_type application/manifest+json; }
    location /assets/ { add_header Cache-Control "public, max-age=31536000, immutable"; try_files $uri =404; }
    location /fonts/ { add_header Cache-Control "public, max-age=31536000, immutable"; try_files $uri =404; }

    # A single-page app: every other path is the app (it draws its own not-found page).
    location / { try_files $uri /index.html; add_header Cache-Control "no-cache"; }
}
